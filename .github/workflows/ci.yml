name: CI - Lint, Test, and Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
          # Fail if any secrets are found
          # Set to true to treat warnings as errors
          extra_args: --fail

      - name: Lint code with ESLint
        run: npm run lint -- --max-warnings 0

      - name: Type check with TypeScript
        run: npx tsc --noEmit

      - name: Run unit and integration tests
        run: npm run test -- --coverage --run

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella

      - name: Build application
        run: npm run build
        env:
          # Use dummy values for build-time env vars
          VITE_SUPABASE_PROJECT_ID: dummy-project-id
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key
          VITE_SUPABASE_URL: https://dummy.supabase.co

  e2e-tests:
    runs-on: ubuntu-latest
    
    # Only run E2E tests on main branch or PRs (not on every push to develop)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Use dummy values for E2E tests
          VITE_SUPABASE_PROJECT_ID: dummy-project-id
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key
          VITE_SUPABASE_URL: https://dummy.supabase.co

      - name: Upload Playwright report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for .env files in git
        run: |
          if git ls-files | grep -E "^\.env($|\.)" ; then
            echo "ERROR: .env files found in git index!"
            echo "Run: git rm --cached .env* && git commit --amend --no-edit"
            exit 1
          fi

      - name: Verify RBAC implementation
        run: |
          echo "Checking RBAC utilities exist..."
          test -f "src/lib/rbac.ts" || (echo "RBAC file missing!" && exit 1)
          
          echo "Checking admin route uses RBAC..."
          grep -q "hasAdminAccess" "src/routes/_authenticated/admin.tsx" || \
            (echo "Admin route not using RBAC!" && exit 1)
          
          echo "Checking for localStorage admin checks (should be removed)..."
          if grep -q "localStorage.*admin" "src/routes/_authenticated/admin.tsx" ; then
            echo "WARNING: Found localStorage admin check in admin.tsx"
            echo "This should use server-validated RBAC instead"
            exit 1
          fi

  all-checks-pass:
    runs-on: ubuntu-latest
    needs: [lint-and-test, e2e-tests, security-checks]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint-and-test.result }}" != "success" ]]; then
            echo "Lint and tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.security-checks.result }}" != "success" ]]; then
            echo "Security checks failed"
            exit 1
          fi
          echo "All checks passed!"
